spring.application.name=finbot-api

# Render injects PORT; 8080 locally.
server.port=${PORT:8080}
server.shutdown=graceful
spring.threads.virtual.enabled=true

# Database: SPRING_DATASOURCE_URL/USERNAME/PASSWORD come from the environment (ADR 0010).
# Migrations run as a separate role through SPRING_FLYWAY_USER/PASSWORD.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Neon suspends after 5 min without queries and advises closing idle connections; closing them
# after 60 s also stops Hikari keepalive pings (every 2 min) from keeping the compute awake.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# Shared secret injected by the Vercel proxy (ADR 0012). Required: startup fails without it.
finbot.origin.secret=${FINBOT_ORIGIN_SECRET:}
